# law_agent 질문 체크리스트 v0 (2026.11.16)
#
# 이 파일은 "무엇을 확인해야 하는가" 목록이다. 법 해석(답)은 넣지 않는다.
# - planner는 이 질문을 지울 수 없고, 사례에 따라 하위 질문만 더한다.
# - min_laws는 검색 결과와 관계없이 근거 묶음에 반드시 넣는 조문이다.
#   번호가 옮겨져도 찾을 수 있게 번호와 제목을 같이 적는다 (retriever가 제목으로 다시 찾음).
# - baseline은 같은 내용을 지금 규칙표 시스템(route_agent)이 어디서 판단하는지다. eval에서 비교 기준으로 쓴다.
#
# answer_type
#   yes_no          : yes / no / unknown
#   yes_no_cond     : yes / no / conditional / unknown (+ conditions)
#   list            : 값 목록 (value.items) — 예: R코드, 처리방법 코드
#   compare         : 사례 값과 법 기준 비교 (value.criterion, value.case_value, value.result met/not_met)
#   text            : 안내 문장 (value.text) — 서류 이름, 기한, 지켜야 할 사항
#
# when: 이 질문을 묻는 조건 (사례 사실 또는 앞 질문의 답). 비어 있으면 항상 묻는다.
# feeds: 답을 쓰는 곳 (composer가 경로·조건·서류·질문을 만들 때)

version: 0
updated: 2026-11-17   # 실제 원문 제목에 맞춤(규칙 별표 4·4의3, 영 별표 4의3). A-2·B-1 필요 사실 보강(오염·지정 의심·금지 물질)

stages:
  A: 분류
  B: 재활용 금지·제한
  C: 순환자원 (관문 1)
  D: 재활용 (관문 2)
  E: 에너지 회수
  F: 처분 (관문 4)
  G: 위탁·서류
  H: 신고·처리계획
  I: 업체 자격
  J: 품목별 특별법

questions:

  # ── A. 분류 ─────────────────────────────────────────────
  - id: A-1
    stage: A
    question: 파트 1이 준 분류번호가 시행규칙 별표 4에 있는 번호이고, 폐기물 이름·성상과 맞는가?
    answer_type: yes_no_cond
    min_laws:
      - {law: WMA_RULE, no: B4, title: 폐기물의 종류별 세부분류}
    needs_facts: [waste_code, waste_name, material_form, components]
    feeds: [classification]
    baseline: preliminary/waste_classifier.py (waste_codes_4.csv)

  - id: A-2
    stage: A
    question: 이 폐기물은 지정폐기물인가? (예 / 아니오 / 분석해야 앎)
    answer_type: yes_no_cond
    min_laws:
      - {law: WMA, no: "2", title: 정의}
      - {law: WMA_DEC, no: B1, title: 지정폐기물의 종류}
      - {law: WMA_RULE, no: B4, title: 폐기물의 종류별 세부분류}
    needs_facts: [waste_code, components, analysis, hazardous_suspect, contamination, waste_status, process]
    feeds: [waste_status, all_gates]
    baseline: preliminary/hazardous_checker.py (hazardous_codes.csv)

  - id: A-3
    stage: A
    question: 지정폐기물 여부를 위탁 전에 분석·확인해야 하는 대상인가? 대상이면 무엇을 언제 확인하는가?
    answer_type: yes_no_cond
    when: "A-2 != yes"
    min_laws:
      - {law: WMA_RULE, no: 17의2, title: 사업장폐기물배출자의 확인 등}
      - {law: GUIDE_DECL, no: "Ⅵ", title: 지정폐기물 해당 여부 확인}
    needs_facts: [waste_code, waste_name, process, analysis]
    feeds: [information_request.designated_check]
    baseline: law_tables/designated_check.py (designated_check_targets.csv)

  - id: A-4
    stage: A
    question: 여러 폐기물이 섞여 있는가? 섞였다면 분리할 수 있는가, 섞인 채로 어떤 분류번호로 보는가?
    answer_type: yes_no_cond
    min_laws:
      - {law: WMA_DEC, no: "7", title: 폐기물의 처리기준 등}
    needs_facts: [components, mixed_with_other, separable]
    feeds: [gate2.route_type]
    baseline: preliminary/mixture_checker.py, gates/gate2.py _route_types

  # ── B. 재활용 금지·제한 ──────────────────────────────────
  - id: B-1
    stage: B
    question: 이 폐기물은 재활용이 금지된 폐기물인가? (법 제13조의2 제2항 각 호)
    answer_type: yes_no_cond
    min_laws:
      - {law: WMA, no: 13의2, title: 폐기물의 재활용 원칙 및 준수사항}
      - {law: WMA_RULE, no: 14의3, title: 폐기물의 재활용 기준 및 준수사항 등}
      - {law: WMA_DEC, no: B1, title: 지정폐기물의 종류}
    needs_facts: [waste_code, components, analysis.pcb, contamination, banned_restricted_substance]
    feeds: [gate1, gate2]
    baseline: preliminary/restriction_checker.py PR-L1~L3 (prohibited_restricted.csv)

  - id: B-2
    stage: B
    question: >-
      이 폐기물이 시행령 별표 4의3 각 호의 '재활용이 제한되는 폐기물'에 해당하는가? 해당하면 그 호가 허용하는 재활용 유형(R코드)은?
      해당하지 않으면 answer 를 "no" 로 하고 items 는 비운다.
      (재활용 예정 유형·재활용 방식·환경성평가 여부는 이 질문의 사실이 아니다 — 재활용 유형은 이 시스템이 법에서 정하는 것이므로 missing_facts 로 묻지 않는다)
    answer_type: list
    min_laws:
      - {law: WMA_DEC, no: B4의3, title: 재활용이 금지되거나 제한되는 폐기물}
    needs_facts: [waste_code, waste_name, components, origin]
    feeds: [gate2.allowed_rcodes]
    baseline: preliminary/restriction_checker.py PR-D1~D7

  # ── C. 순환자원 (관문 1) ─────────────────────────────────
  - id: C-1
    stage: C
    question: 이 폐기물이 순환자원 지정 고시의 품목인가? 품목 한정(예 IC 트레이만, 알루미늄·구리만, 도정 공장 발생분만)에 맞는가?
    answer_type: yes_no_cond
    min_laws:
      - {law: CEA_DESIG, no: B1, title: 순환자원 지정 대상}
      - {law: CEA, no: "9", title: 순환자원의 지정 등}
    needs_facts: [waste_code, waste_name, item_specific]
    feeds: [gate1]
    baseline: gates/gate1.py _pick_rows (designated_resources.csv)

  - id: C-2
    stage: C
    question: 고시가 정한 용도(허용 R코드)와 방법 기준(이물질, 혼합 금지, 보관 방법)은 무엇이고, 사례가 맞는가?
    answer_type: yes_no_cond
    when: "C-1 in [yes, conditional]"
    min_laws:
      - {law: CEA_DESIG, no: B1, title: 순환자원 지정 대상}
      - {law: CEA_DESIG, no: B2, title: 순환이용의 용도, 방법 및 기준 등}
    needs_facts: [mixed_with_other, foreign_matter, storage_state]
    feeds: [gate1.conditions]
    baseline: gates/gate1.py _check_conditions

  # ── D. 재활용 (관문 2) ───────────────────────────────────
  - id: D-1
    stage: D
    question: 이 분류번호에 허용된 재활용 유형(R코드)은 무엇이고, 각각 사전 분석이 필요한가?
    answer_type: list
    when: "B-1 != yes"
    min_laws:
      - {law: WMA_RULE, no: B4의3, title: 폐기물의 종류별 재활용 가능 유형}
      # 별표 4의2(R코드 정의)는 D-2 에서 D-1 의 R코드가 든 호만 넣는다 (2026.11.17 inspect_laws: 제목 불일치로 빠지고 있었음)
    needs_facts: [waste_code, components]
    feeds: [gate2.routes]
    baseline: gates/gate2.py allowed_rcodes (recycling_types_4_3.csv, rcode_detail_4_2.csv)

  - id: D-2
    stage: D
    question: 허용 R코드 중 사례의 형태(원형 보존, 파쇄, 분말, 액상)로 실제 할 수 있는 것은? (재사용 R-1·R-2 등)
    answer_type: list
    when: "D-1 has items"
    min_laws:
      - {law: WMA_RULE, no: B4의2, title: 폐기물의 재활용 유형별 세부분류}
    needs_facts: [material_form]
    feeds: [gate2.conditions]
    baseline: gates/gate2.py _apply_checks (재사용 형태)

  - id: D-3
    stage: D
    question: 이 재활용 유형에 적용되는 재활용 기준은 무엇인가?
    answer_type: text
    attach: true        # 모델 없이 원문 첨부 (2026.11.18 비용)
    when: "D-1 has items"
    min_laws:
      - {law: WMA_RULE, no: B5의3, title: 폐기물의 재활용 기준}
    needs_facts: [waste_code]
    feeds: [related_laws, route.conditions]
    baseline: proposal/related_laws.py (재활용 기준, 원문만 붙임)

  - id: D-4
    stage: D
    question: 재활용 업체가 지켜야 할 준수사항은 무엇인가?
    answer_type: text
    attach: true        # 모델 없이 원문 첨부 (2026.11.18 비용)
    when: "D-1 has items"
    min_laws:
      - {law: WMA_RULE, no: B5의4, title: 폐기물을 재활용하는 자의 준수사항}
    needs_facts: []
    feeds: [related_laws]
    baseline: proposal/related_laws.py (재활용 준수사항)

  - id: D-5
    stage: D
    question: 지정폐기물을 재활용하면 어떤 허가를 가진 업체에만 맡길 수 있는가?
    answer_type: text
    attach: true        # 지정폐기물 위탁 허가: 원문 첨부 (조건 문장으로만 쓰임)
    generic: true       # 사례 이름 없이 검색 → 사례끼리 캐시 공유 (2026.11.18 비용)
    when: "A-2 == yes and D-1 has items"
    min_laws:
      - {law: WMA, no: "25", title: 폐기물처리업}
    needs_facts: [waste_status]
    feeds: [gate2.conditions, partner_filter]
    baseline: gates/gate2.py _apply_checks (지정폐기물 조건)

  # ── E. 에너지 회수 ───────────────────────────────────────
  - id: E-1
    stage: E
    question: 에너지 회수(R-9 계열)로 인정되는 기준(저위발열량, 회수효율, 외부 공급 등)은 무엇이고, 사례 값이 충족하는가?
    answer_type: compare
    when: "D-1 has R-9"
    min_laws:
      - {law: WMA_RULE, no: "3", title: 에너지 회수기준 등}
    needs_facts: [heating_value, combustible, waste_status]
    feeds: [requirements, information_request]
    baseline: law_tables/energy.py (energy_recovery_criteria.csv)

  # ── F. 처분 (관문 4) ─────────────────────────────────────
  - id: F-1
    stage: F
    question: >-
      이 폐기물에 허용된 처분 방법(소각·매립·중간처분)은 무엇인가? items 에는 원문에 적힌 방법 이름을 그대로 쓴다
      (예: "소각", "고온소각", "매립", "증발농축", "중화"). 처리방법 코드(4자리)는 법 원문에 없으므로 근거 부족으로 보지 않는다
      — [사실 데이터]에 그 방법과 같은 이름의 코드가 있으면 items 에 함께 적어도 된다.
      분류번호별 규정이 없으면 이 폐기물 구분(사업장일반·지정)과 성상(가연성·불연성)에 적용되는 일반 규정으로 답한다.
    answer_type: list
    min_laws:
      - {law: WMA_RULE, no: B5, title: 폐기물의 처리에 관한 구체적 기준 및 방법, section: {general: 사업장일반폐기물의 기준, designated: 지정폐기물(의료폐기물은 제외한다)의 기준, medical: 의료폐기물의 기준}, subsection: 처리의 경우}
    needs_facts: [waste_code, waste_status, material_form, combustible, quantity.daily_avg_kg]
    feeds: [gate4.routes]
    baseline: gates/gate4.py _matching_rows (disposal_methods_5.csv, treatment_code_map.csv)

  - id: F-2
    stage: F
    question: 그 처분 방법을 쓸 때 지켜야 할 조건·수치 기준은? (소각 곤란 시에만 매립, 파쇄 크기, 수분 함량, 잔재물 처리 등)
    answer_type: yes_no_cond
    when: "F-1 has items"
    min_laws:
      - {law: WMA_RULE, no: B5, title: 폐기물의 처리에 관한 구체적 기준 및 방법, section: {general: 사업장일반폐기물의 기준, designated: 지정폐기물(의료폐기물은 제외한다)의 기준, medical: 의료폐기물의 기준}, subsection: 처리의 경우}
    needs_facts: [waste_code, waste_name, waste_status, material_form, combustible, quantity, quantity.daily_avg_kg]
    feeds: [gate4.conditions]
    baseline: gates/gate4.py _base, _routes_from_row

  # ── G. 위탁·서류 ─────────────────────────────────────────
  - id: G-1
    stage: G
    question: 처리를 위탁할 때 지켜야 할 기준·절차는? (적법 수탁자 확인, 수탁처리능력 확인서, 서면 계약, 보관 기간)
    answer_type: text
    attach: true        # 모델 없이 원문 첨부 (2026.11.18 비용)
    min_laws:
      - {law: WMA, no: "18", title: 사업장폐기물의 처리}
      - {law: WMA_RULE, no: 16의13, title: 위탁ㆍ수탁의 기준 및 절차}
    needs_facts: [waste_status]
    feeds: [document_triggers, related_laws]
    baseline: proposal/documents.py CT-VI-4, CT-VI-7 (condition_texts.csv)

  - id: G-2
    stage: G
    question: 전자정보처리프로그램(올바로)으로 인계·인수 내용을 입력해야 하는가? 제외 대상인가? 입력 기한은?
    answer_type: yes_no_cond
    generic: true       # 사례 이름 없이 검색 → 사례끼리 캐시 공유 (2026.11.18 비용)
    min_laws:
      - {law: WMA, no: "45", title: 폐기물 인계ㆍ인수 내용 등의 전산 처리}
      - {law: WMA_RULE, no: "20", title: 사업장폐기물의 인계ㆍ인수}
      - {law: ALLBARO_NOTICE, no: "", title: 폐기물 전자정보처리 프로그램 운영 및 사용 등에 관한 고시}
    needs_facts: [waste_code, gate, plan_check]   # plan_check → H-2(처리계획 대상) 판단 뒤에 묻는다 (2026.11.20 실행마다 답이 갈림)
    feeds: [document_triggers]
    baseline: proposal/documents.py CT-18-3, CT-VII-2-EXEMPT

  - id: G-3
    stage: G
    question: 운반 업체가 지켜야 할 운반 기준은?
    answer_type: text
    attach: true        # 모델 없이 원문 첨부 (2026.11.18 비용)
    min_laws:
      - {law: WMA_DEC, no: "7", title: 폐기물의 처리 기준 등}            # 운반기준 본문 (제1항). 시행규칙 9조는 임시보관장소만 (2026.11.18)
      - {law: WMA_RULE, no: "9", title: 폐기물 수집ㆍ운반업자 등의 운반기준}
    needs_facts: [waste_status, material_form]
    feeds: [related_laws]
    baseline: proposal/related_laws.py (운반)

  - id: G-4
    stage: G
    question: 순환자원으로 판매하면 인계서·수탁처리능력 확인 대상에서 빠지는가? 어떤 조건에서인가?
    answer_type: yes_no_cond
    when: "C-1 in [yes, conditional]"
    min_laws:
      - {law: CEA, no: "9", title: 순환자원의 지정 등}
      - {law: CEA_DESIG, no: B2, title: 순환이용의 용도, 방법 및 기준 등}
    needs_facts: []
    feeds: [gate1.conditions, document_triggers]
    baseline: gates/gate1.py _route (조건 문구)

  # ── H. 신고·처리계획 ─────────────────────────────────────
  - id: H-1
    stage: H
    question: 이 배출 사업장은 사업장폐기물배출자 신고 대상인가?
    answer_type: compare
    generic: true       # 사례 이름 없이 검색 → 사례끼리 캐시 공유 (2026.11.18 비용)
    min_laws:
      - {law: WMA, no: "17", title: 사업장폐기물배출자의 의무 등}
      - {law: WMA_RULE, no: "18", title: 사업장폐기물배출자의 신고}
      - {law: GUIDE_DECL, no: "", title: 사업장폐기물 배출자신고 및 처리계획 확인 업무처리지침}
    needs_facts: [quantity, quantity.monthly_avg_ton, quantity.daily_avg_kg, quantity.yearly_ton, waste_status, business_type, process]
    feeds: [related_laws, information_request]
    baseline: proposal/related_laws.py (배출자 신고, 원문만 — 규칙표 판정 없음 → 추가 발견 후보)

  - id: H-2
    stage: H
